name: fantasy
title: Fantasy and science fiction
description: >-
  Fantasy, science fiction and their web-novel kin (xuanhuan, xianxia): stated costs
  and limits of magic or technology hold, travel takes the time the map says, and
  exposition does not swallow the scene.
selection:
  keywords: [fantasy, romantasy, science fiction, sci-fi, scifi, sf, space opera, litrpg, xuanhuan, xianxia, wuxia, 玄幻, 仙侠, 奇幻, 科幻, 武侠, 修仙]
styles: styles
checks:
  # Sanderson's laws: the reader can only enjoy a magic system that keeps its own rules.
  continuity/world-rule-broken: error
  # Secondary worlds live on their maps.
  continuity/impossible-travel: error
  continuity/negative-resource: error
  # Invented names have no dictionary to keep them straight: one spelling per term.
  style/invented-term-spelling: warning
# Measured on the fantasy reference books (@plotlint/metrics baselines/fantasy.json,
# about p5 to p95 of their chapters): long journeys alone or among strangers leave
# chapters with almost no dialogue, so there is no dialogue floor, and secondary
# worlds are described through the senses more densely than general fiction.
# Their paragraphs also run longer: the old 300-word wall-of-text ceiling flagged
# two reference chapters in five, the general 427 one in seven.
metrics:
  metrics/dialogue-ratio: { min: 0, max: 0.69, source: fantasy reference books }
  metrics/sensory-detail: { min: 7, source: fantasy reference books }
  metrics/wall-of-text: { max: 541, source: fantasy reference books }
# The closed loop: the world's rules and invented names come first, and the panel reads for the world.
loop:
  priority: [continuity/world-rule-broken, style/invented-term-spelling]
  readers:
    - name: worldbuilding-fan
      brief: You read fantasy and science fiction for the world. You notice when its rules bend to suit the plot, and when invented terms arrive in a pile without being shown in use.
    - name: skeptic
      brief: You are a skeptical reader. You notice when characters act without a reason, when coincidences do the plot's work, and when the prose tells you what to feel.
    - name: newcomer
      brief: You rarely read fantasy. You get lost when names, places and rules arrive without enough context, and you lose interest when nothing is at stake.
