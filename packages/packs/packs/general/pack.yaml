# The always-on pack. Every other pack extends it implicitly and can override it.
name: general
title: General
description: >-
  Checks that hold for most fiction: continuity, setup and payoff, the cut test, POV
  discipline, AI-tell and cliché lists, and loose prose-metric floors.
# @plotlint/style's general pack (style/general.*), shared so its ids and suppressions stay stable.
styles: builtin:general
checks:
  # Continuity rules run at their own defaults; the general pack only names the
  # structural checks it keeps quiet, since they describe rather than prove.
  structure/unpaid-setup: warning
  structure/unearned-payoff: warning
  # Judged by the scene annotator, so a note whatever the setting.
  structure/pov-discipline: note
  structure/cut-candidate: note
  structure/open-questions: note
  structure/subplot-balance: note
  structure/scene-turn: note
  structure/goal-conflict-outcome: note
  structure/protagonist-agency: note
  structure/tension-curve: note
  # Genre checks: off here, on in their genre's pack.
  structure/fair-play: off
  structure/hopeful-ending: off
  structure/central-relationship: off
  structure/both-leads-pov: off
  # Name spelling drift is a slip in any book; a note outside fantasy.
  style/invented-term-spelling: note
# Floors and bands, never targets: a metric flags only text outside the band. The
# general bands live in @plotlint/metrics (baselines/general.json, measured on
# public-domain reference novels); genre packs replace them by rule id with bands
# measured on their own genre's reference books, in the metric rules' units
# (MTLD score, dialogue share of words 0-1, words in the longest unbroken run).
