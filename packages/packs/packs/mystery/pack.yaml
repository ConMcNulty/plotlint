name: mystery
title: Mystery and detective
description: >-
  Fair-play mysteries: clues set up before the reveal, no one acting on what they
  cannot know yet, a timeline alibis can be checked against.
selection:
  keywords: [mystery, detective, whodunit, crime, cozy mystery, noir, police procedural, sleuth, 推理, 悬疑, 侦探, 探案]
styles: styles
checks:
  # Fair play: a character (the detective above all) cannot act on a secret before learning it.
  continuity/knowledge-leak: error
  # Alibis rest on when things happened.
  continuity/timeline-order: error
  # Every clue shown should matter; every solution should rest on clues shown. Warnings, not
  # errors: both read the settler's hook ledger, which on the lessing-fen eval book left most
  # questions the prose answers open (packages/rules/eval/corpus/lessing-fen/SCORE.md).
  structure/unpaid-setup: warning
  structure/unearned-payoff: warning
  structure/open-questions: warning
  # Knox and Van Dine: the culprit on stage early, the solution resting on clues shown before the reveal.
  structure/fair-play: warning
# Measured on the mystery reference books (@plotlint/metrics baselines/mystery.json,
# about p5 to p95 of their chapters): interrogation and interview push dialogue
# higher than in general fiction, and narration comes in shorter runs.
metrics:
  metrics/dialogue-ratio: { min: 0.08, max: 0.94, source: mystery reference books }
  metrics/wall-of-text: { max: 365, source: mystery reference books }
# The closed loop: fair play and knowledge come before everything else, and the panel reads for clues.
loop:
  priority: [continuity/knowledge-leak, structure/fair-play, continuity/timeline-order]
  readers:
    - name: armchair-detective
      brief: You read mysteries to solve them before the detective does. You track every clue and alibi, and you notice when the detective knows something you were never shown.
    - name: skeptic
      brief: You are a skeptical reader. You notice when characters act without a reason, when coincidences do the plot's work, and when the prose tells you what to feel.
    - name: newcomer
      brief: You rarely read mysteries. You get lost when suspects and places arrive without enough context, and you lose interest when nothing is at stake.
