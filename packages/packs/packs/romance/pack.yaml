name: romance
title: Romance
description: >-
  Romance and romantic fiction, where the central relationship drives the plot:
  agency is shared between the leads, and interiority and dialogue carry the story.
selection:
  keywords: [romance, romantic, romantasy, love story, rom-com, romcom, 言情, 爱情, 甜宠, 恋爱]
styles: styles
checks:
  # The relationship drives the plot; "the protagonist" is two people, and much of what
  # turns a romance is done to a lead by the other one.
  structure/protagonist-agency: note
  # Romance subplots often go quiet while the relationship takes over; that is the genre.
  structure/subplot-balance: note
  # Emotional beats, not stakes, carry tension; the stakes estimate fits poorly.
  structure/tension-curve: note
  structure/scene-turn: note
  # The genre's promise (RWA): a happy or hopeful ending for the central couple.
  structure/hopeful-ending: warning
  # The relationship is the main plot, and both leads get a point of view.
  structure/central-relationship: note
  structure/both-leads-pov: note
# No metric bands of its own: on the romance reference books (@plotlint/metrics
# baselines/romance.json) dialogue and paragraph length sit in the general bands,
# and the old 15% dialogue floor flagged about one reference chapter in ten.
# The closed loop: the central relationship comes first, and the panel reads for the leads.
loop:
  priority: [structure/central-relationship, structure/both-leads-pov, structure/hopeful-ending]
  readers:
    - name: romance-reader
      brief: You read romance for the relationship. You notice when the leads are apart for too long, when their attraction is told rather than shown, and when a conflict could be solved by one honest conversation.
    - name: skeptic
      brief: You are a skeptical reader. You notice when characters act without a reason, when coincidences do the plot's work, and when the prose tells you what to feel.
    - name: newcomer
      brief: You rarely read romance. You lose interest when nothing is at stake beyond the relationship, and you get lost when a cast arrives without enough context.
